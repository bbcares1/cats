# Shared messages. Annotation driven validation carries its own text, this file
# exists so #{} lookups always resolve instead of failing at render time.
validation.failed=Please correct the highlighted fields and try again.
error.title=Something went wrong
error.accessDenied=You are not allowed to open this page.
error.stale=Someone else changed this record. Reload the page and try again.
application.submitted=Application submitted.
claim.submitted=Claim submitted.
