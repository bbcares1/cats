spring:
  application:
    name: cats
  profiles:
    default: local
  datasource:
    url: ${CATS_DB_URL:jdbc:mysql://localhost:3306/cats?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${CATS_DB_USERNAME:cats_app}
    password: ${CATS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  messages:
    basename: messages
    encoding: UTF-8

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

cats:
  time:
    zone: Asia/Singapore
  storage:
    root: data/vault
    max-file-size: 5242880
  mail:
    mode: capture
    capture-dir: data/mail
    from: no-reply@cats.local
    base-url: http://localhost:8080
    worker-enabled: true
    worker-interval-ms: 15000
    max-attempts: 5

logging:
  level:
    root: INFO
    sg.edu.nus.cats: INFO
    org.flywaydb: INFO
